[package]
name = "clientmcp-client"
description = "ClientMCP for Rust applications: expose a running application's functions as MCP tools over one outbound WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
futures-util = "0.3.34"
rand = "0.10.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = "0.7"

[dev-dependencies]
clientmcp-core = { path = "../core" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "process"] }
