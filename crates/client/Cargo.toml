[package]
name = "clientmcp-client"
description = "ClientMCP for Rust applications: expose a running application's functions as MCP tools over one outbound WebSocket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Minimum versions, not the newest: an application embedding the client keeps
# its own lock.
[dependencies]
futures-util = "0.3"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1.40", features = ["rt", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = "0.7"

# The roots a connection trusts. macOS, Windows and Linux hand theirs out;
# iOS and Android keep theirs to themselves (no file to read, no API that
# lists them), so there it is Mozilla's, bundled.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rustls-native-certs = "0.8"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
webpki-roots = "1"

[dev-dependencies]
clientmcp-core = { path = "../core" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "process"] }
