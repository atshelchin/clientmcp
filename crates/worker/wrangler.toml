name = "clientmcp"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
# Request.signal on incoming requests: how a hang-up before a call's answer is
# seen (src/lib.rs, on_abort).
compatibility_flags = ["enable_request_signal"]
routes = [{ pattern = "bridge.clientmcp.dev", custom_domain = true }]

[build]
command = "worker-build --release"

[[durable_objects.bindings]]
name = "CLIENTS"
class_name = "ClientObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClientObject"]

[vars]
# Tool call timeout in seconds.
CLIENTMCP_CALL_TIMEOUT = "120"
# A client that sends nothing for this long is presumed gone (SPEC §3.2).
CLIENTMCP_CLIENT_IDLE = "90"
# Browser origins allowed on /mcp: comma-separated, or "*". Empty allows none.
CLIENTMCP_ALLOWED_ORIGINS = ""

# The token secret is a secret, not a var:
#   wrangler secret put CLIENTMCP_SECRET
# For `wrangler dev`, put it in .dev.vars:
#   CLIENTMCP_SECRET=<at least 32 bytes>

# Self-serve tokens (docs/self-serve.md). Every binding below is optional at
# runtime: without one, the bridge works as before.
[[d1_databases]]
binding = "BRIDGE_DB"
database_name = "clientmcp-bridge"
database_id = "14e492ce-705d-4406-b404-60323e965799"
migrations_dir = "migrations"

[[analytics_engine_datasets]]
binding = "SIGNALS"
dataset = "clientmcp_signals"

# The protective rate limit: only against blatant abuse.
[[ratelimits]]
name = "AGENT_LIMIT"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

