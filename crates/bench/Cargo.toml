[package]
name = "clientmcp-bench"
description = "Load generator for ClientMCP bridges"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1.12.1"
clientmcp-core = { path = "../core" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
