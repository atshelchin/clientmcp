[package]
name = "clientmcp-server"
description = "ClientMCP bridge for Linux servers and Docker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "clientmcp"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
clientmcp-core = { path = "../core" }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
serde_json = "1.0.154"
