name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude clientmcp-worker --all-targets -- -D warnings
      - run: cargo clippy -p clientmcp-worker --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --exclude clientmcp-worker
      - run: npm ci && npm run build
        working-directory: sdk/js
      - run: npm ci
        working-directory: tests
      - name: Conformance, server
        run: tests/run-native.sh
      - run: cargo install worker-build --locked
      - name: Conformance, Worker in workerd
        run: tests/run-worker.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clientmcp .
      - run: docker run --rm -e CLIENTMCP_SECRET=$(openssl rand -hex 32) clientmcp token client ci
