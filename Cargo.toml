[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/worker", "crates/bench", "crates/client"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atshelchin/clientmcp"
